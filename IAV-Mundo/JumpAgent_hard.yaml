# MP2 — JumpAgent SEM currículo (baseline para comparar no TensorBoard)
# Uso: mlagents-learn JumpAgent_hard.yaml --run-id=jump_hard_01
# Mesmos hiperparâmetros que JumpAgent_curriculum.yaml; só muda a dificuldade,
# que fica fixa na lição final desde o primeiro step.

behaviors:
  JumpAgent:
    trainer_type: ppo
    hyperparameters:
      batch_size: 1024
      buffer_size: 10240
      learning_rate: 3.0e-4
      beta: 5.0e-3
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
      learning_rate_schedule: linear
    network_settings:
      normalize: false
      hidden_units: 256
      num_layers: 2
    reward_signals:
      extrinsic:
        gamma: 0.99
        strength: 1.0
    keep_checkpoints: 5
    max_steps: 3000000
    time_horizon: 128
    summary_freq: 10000

environment_parameters:
  difficulty: 4      # experimentem também 3 (vários buracos sem desvio lateral)
