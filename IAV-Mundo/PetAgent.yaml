behaviors:
  PetAgent:
    trainer_type: ppo
    hyperparameters:
      batch_size: 1024
      buffer_size: 10240
      learning_rate: 5.0e-4
      beta: 5.0e-3
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
      learning_rate_schedule: linear
    network_settings:
      normalize: true
      hidden_units: 128
      num_layers: 3
      vis_encode_type: simple
    reward_signals:
      extrinsic:
        gamma: 0.99
        strength: 1.0
    keep_checkpoints: 5
    max_steps: 2500000
    time_horizon: 64
    summary_freq: 10000
    
environment_parameters:
  stage:
    curriculum:
      - name: Lesson0_survival
        completion_criteria:
          measure: reward
          behavior: PetAgent
          signal_smoothing: false
          min_lesson_length: 500
          threshold: -0.01
        value: 0
      - name: Lesson1_orders
        completion_criteria:
          measure: reward
          behavior: PetAgent
          signal_smoothing: false
          min_lesson_length: 100
          threshold: 75
        value: 1
      - name: Lesson2_random
        value: 2
